[[results]]
scenario_id = "offlineimap-800"
status = "limited"
evidence = "real-client"
client_version = "8.0.0"
platform = "Linux amd64"
tested_at = "2026-10-22"
tested_revision = "6700b75"
assertions = [
  "OfflineIMAP 8.0.0 (imaplib2 3.06, Python 3.12.13, OpenSSL 3.5.6) synchronized a Veksel mailbox over IMAP with STARTTLS and a self-signed certificate: `offlineimap.py -c offlineimaprc` with a Maildir local repository, remote `ssl = no`, `starttls = yes`, and `sslcacertfile` set to the certificate; messages were seeded by SMTP delivery",
  "pass: first full sync created all folders (INBOX, Drafts, Sent, Trash, Junk, Archive) and downloaded 5 seeded messages",
  "pass: incremental sync downloaded 5 further messages",
  "pass: client-to-server flag change (\\Seen, \\Flagged) and server-to-client flag change (\\Answered, \\Seen) round-tripped",
  "pass: client-side deletion and server-side deletion with expunge each propagated",
  "pass: a Maildir message created locally was uploaded with APPEND, and a locally created Maildir folder became an IMAP mailbox",
  "pass: a no-change sync was idempotent",
  "fixed during this run: the generic 10 commands per second IMAP limiter disconnected the first sync with BYE; the per-IP login limiter counted successful logins and refused later connections; STORE upper-cased flags, so \\Seen was stored as \\SEEN and keywords lost their case",
  "fixed 2026-10-22: the intermittent stall after STARTTLS (client waiting for CAPABILITY, server idle in a TLS read) was triggered by the TLS 1.3 session ticket Go sends in the server's first flight; imaplib2 processes it in its reader thread while its writer thread sends CAPABILITY on the same OpenSSL connection, and the command never reaches the server. With tickets 25 of 300 imaplib2 STARTTLS sessions hung, with IMAP session tickets disabled 0 of 300 on the same build, then 0 of 400 on the fixed build",
  "pass: 50 consecutive OfflineIMAP syncs ran back to back without stalls or connection refusals on the fixed build (previously runs needed a 3 second gap to stay under the per-IP connection limiter)",
]
limitations = [
  "OfflineIMAP 8.0.0 does not start on Python 3.12 unpatched; the run used the v8.0.0 source tree with three client-side compatibility edits (SafeConfigParser alias, removal of the unused imp import, accepting sqlite threadsafety 3), which do not alter protocol behavior",
  "The STARTTLS stall is an imaplib2 threading defect (concurrent SSL reads and writes on one OpenSSL connection); Veksel avoids triggering it by not issuing IMAP session tickets, but other post-handshake TLS messages could still expose it",
  "Implicit-TLS (port 993 style) could not be exercised because OfflineIMAP 8.0.0 fails with an internal 'int object is not subscriptable' error on Python 3.12; IDLE, QRESYNC/CONDSTORE, and large mailboxes were not tested",
]

