  "pass (2026-10-23): discovery found every calendar (including a shared and a non-ASCII `Kalender æøå` collection) and address book; local create, server create (raw PUT), local modification uploaded with If-Match and the ETag from the PUT reply, server deletion, local deletion, and an idempotent repeat sync all propagated for events and vCards",
  "fixed 2026-10-21: addressbook-multiget (the RFC 6352 report name) was refused with 400; calendar-multiget responses omitted getetag; /.well-known/caldav and /.well-known/carddav, PROPFIND on /dav/, current-user-principal, calendar-home-set, and addressbook-home-set were missing, so only a URL naming the account root worked",
